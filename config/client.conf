# MailClient configuration
# Lines starting with # are comments. Format: key = value
# The password is NOT stored here; the client asks for it when it is needed.

# Mail server (hMailServer on this computer)
server = 127.0.0.1
smtp_port = 25
pop3_port = 110

# Optional: address suggested at the login screen (press Enter to accept it).
# Any account on the server can be used; the password is asked at login.
default_email = User_2@test.local

# Seconds to wait for a server reply before giving up
timeout_seconds = 10

# Where downloaded messages and the log are stored
mailbox_dir = data/mailbox
log_file = logs/client.log